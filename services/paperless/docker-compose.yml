name: "paperless"

services:

####################
# Paperless
####################

  paperless:
    container_name: paperless
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5

    depends_on:
      paperless_db:
        condition: service_healthy
        restart: true
      paperless_broker:
        condition: service_started

    networks:
      - caddy-net
      - paperless-net
      - ai-net
    
    ports:
      - ${PORT_PAPERLESS}:8000

    environment:
      USERMAP_UID: ${PUID}
      USERMAP_GID: ${PGID}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_OCR_LANGUAGE: 'eng'
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRETKEY}
      PAPERLESS_DATE_ORDER: MDY

      PAPERLESS_WEBSERVER_WORKERS: 2
      PAPERLESS_CONSUMER_POLLING: 600 # only needed if not NFS: https://docs.paperless-ngx.com/troubleshooting/#consumer-fails-to-pickup-any-new-files

      PAPERLESS_REDIS: redis://paperless_broker:6379
      PAPERLESS_DBHOST: paperless_db
      PAPERLESS_DBNAME: ${PAPERLESS_DB_NAME}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}

      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://${EXTERNAL_PAPERLESS}.${DOMAIN} # defined in the Caddyfile
      PAPERLESS_ALLOWED_HOSTS: ${EXTERNAL_PAPERLESS}.${DOMAIN},192.168.1.203
      PAPERLESS_CORS_ALLOWED_ORIGINS: https://${EXTERNAL_PAPERLESS}.${DOMAIN}

      PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: false
      PAPERLESS_APPS: "allauth.socialaccount.providers.openid_connect"
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect": {"APPS": [{"provider_id": "oidc","name": "${VOIDAUTH_NAME}","client_id": "${PAPERLESS_OIDC_CLIENT_ID}","secret": "${PAPERLESS_OIDC_CLIENT_SECRET}","settings": { "server_url": "https://${EXTERNAL_VOIDAUTH}.${DOMAIN}/oidc/.well-known/openid-configuration"}}]}}'
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: false
      PAPERLESS_SOCIAL_AUTO_SIGNUP: false

      PAPERLESS_AI_ENABLED: true
      PAPERLESS_AI_MODEL: ollama
      PAPERLESS_AI_LLM_ENDPOINT: http://ollama:11434
      PAPERLESS_AI_LLM_MODEL: llama3.1:latest
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: nomic-embed-text:latest
      PAPERLESS_AI_LLM_BACKEND: ollama
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ollama
      
      PAPERLESS_AI_MODEL_PORT: ${PORT_OLLAMA}

    labels:
      - homepage.group=Office
      - homepage.name=Paperless
      - homepage.icon=paperless
      - homepage.href=http://${SERVER_URL}:${PORT_PAPERLESS}
      - homepage.description=Scan, index and archive all your physical documents
      - homepage.widget.type=paperlessngx
      - homepage.widget.url=http://${SERVER_URL}:${PORT_PAPERLESS}
      - homepage.widget.username=${HOMEPAGE_PAPERLESS_USERNAME}
      - homepage.widget.password=${HOMEPAGE_PAPERLESS_PASSWORD}
      - dockpeek.tags=samba,oidc,ai

    volumes:
      - ${CONFIGDIR}/paperless:/usr/src/paperless/data
      - ${DIR_DOCUMENT}/paperless:/usr/src/paperless/media
      - ${BACKUPDIR}/paperless:/usr/src/paperless/export # used for backup/exporting documents via paperless document_exporter
      - ${PAPERLESS_CONSUMEDIR}:/usr/src/paperless/consume

    healthcheck:
      interval: 360s
      retries: 5
      start_period: 45s
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      timeout: 10s
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4096M
    restart: unless-stopped


  paperless_broker:
    container_name: paperless_broker
    image: redis:alpine

    networks:
      - paperless-net

    labels:
      - homepage.group=Brokers
      - homepage.name=Paperless | Redis
      - homepage.icon=redis
      - homepage.weight=850

    volumes:
      - ${DBDIR}/paperless-redis:/data

    deploy:
        resources:
          limits:
            cpus: '1'
            memory: 256M
    restart: unless-stopped

  paperless_db:
    container_name: paperless_db
    image: postgres:15.4-alpine

    networks:
      - paperless-net

    environment:
      POSTGRES_DB: ${PAPERLESS_DB_NAME}
      POSTGRES_USER: ${PAPERLESS_DB_USER}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}

    labels:
      - homepage.group=Databases
      - homepage.name=Paperless | Postgres DB
      - homepage.icon=postgres
      - homepage.weight=800
      - dockpeek.tags=pinned,db

    volumes:
      - ${DBDIR}/paperless-postgres:/var/lib/postgresql/data

    healthcheck:
      interval: 360s
      retries: 10
      start_period: 30s
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - ${PAPERLESS_DB_NAME}
        - '-U'
        - ${PAPERLESS_DB_USER}
      timeout: 45s
      
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

networks:
  caddy-net:
    name: caddy-net
    external: true
  paperless-net:
    name: paperless-net
  ai-net:
    name: ai-net
    external: true


####################
# Templates
####################

x-security-defaults: &secure-profile
  cap_drop:
    - ALL #If your container needs to bind to a privileged port under 1024 (like port 80), dropping all capabilities might break it.
  read_only: true # If an attacker gains access to your container, they cannot download a malicious script, modify your source code, or replace system binaries because the disk is strictly write-protected.
  security_opt:
    - no-new-privileges=true # processes inside the container can ever gain new privileges via SUID/SGID binaries